<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ya estás en la lista · Plancito</title>
<meta name="theme-color" content="#15121C">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root { --bg: #15121C; --surface: #221D2C; --line: #3A3346; --fg: #F6F2EC; --muted: #B3ACBF; --accent: #FF5B3A; --lime: #E4F5A8; --blue: #8AD1FF; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg); font-family: "DM Sans", system-ui, sans-serif; font-size: 16px; line-height: 1.5; display: grid; place-items: center; padding: 32px max(20px, env(safe-area-inset-right, 0px)) 32px max(20px, env(safe-area-inset-left, 0px)); }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
main { max-width: 480px; display: flex; flex-direction: column; gap: 18px; }
.ok { width: 56px; height: 56px; border-radius: 16px; background: var(--lime); display: grid; place-items: center; }
h1 { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 800; font-size: 40px; line-height: 1.02; letter-spacing: -1px; margin: 0; }
p { margin: 0; color: var(--muted); font-size: 17px; }
.card { background: var(--surface); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.card strong { font-size: 17px; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 14px; background: var(--accent); color: #15121C; font-weight: 700; text-decoration: none; padding: 0 20px; }
.back { color: var(--fg); font-size: 15px; }
</style>
</head>
<body>
<main>
  <div class="ok"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#15121C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></div>
  <h1>Ya estás en la lista.</h1>
  <p>Te escribimos en cuanto Plancito abra en tu ciudad.</p>
  <div class="card">
    <strong>¿Le pasas la voz a tus amigas?</strong>
    <p>Mientras más personas de tu ciudad se apunten, antes abrimos ahí. Y con cita doble pueden salir juntas.</p>
    <a class="btn" id="share" href="https://wa.me/?text=Mira%20esta%20app%20de%20citas%3A%20%C3%A9l%20te%20invita%20a%20un%20plan%20real%20y%20t%C3%BA%20eliges.%20Todos%20verificados.%20https%3A%2F%2Fplancito.mx%2F%3Fref%3Damiga" target="_blank" rel="noopener">Compartir por WhatsApp</a>
  </div>
  <a class="back" href="/">Volver al inicio</a>
</main>
<script>
// Usa el dominio real en el link para compartir, sea cual sea el sitio donde está publicada la página.
try {
  var url = location.origin + "/?ref=amiga";
  var text = "Mira esta app de citas: él te invita a un plan real y tú eliges. Todos verificados. " + url;
  document.getElementById("share").href = "https://wa.me/?text=" + encodeURIComponent(text);
} catch (e) {}
</script>
</body>
</html>
